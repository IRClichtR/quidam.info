#cloud-config
# quidam server setup, for Ubuntu 24.04 LTS on a small cloud server (written for Hetzner Cloud).
#
# How to use it: when you create the server in the Hetzner console, open "Cloud config" and paste
# this whole file there. The server then sets itself up on its first boot (about 3 to 5 minutes).
#
# BEFORE PASTING: replace the line `ssh-ed25519 AAAA... REPLACE_WITH_YOUR_PUBLIC_KEY` below with
# your own public SSH key: the one line inside ~/.ssh/id_ed25519.pub on your computer
# (create it with `ssh-keygen -t ed25519` if you have none). Keep the two spaces of indentation
# and the dash in front of it.
#
# What it does:
# - creates `deploy`, the only account that can log in (by SSH key only, never by password),
#   and `quidam`, a locked account that only runs the website;
# - turns off root login and password login;
# - installs Node.js 24, the Caddy web server, rsync, and automatic security updates
#   (with an automatic reboot at 04:30 UTC when an update needs one);
# - opens only the ports the site needs in the firewall: 22 (SSH), 80 and 443 (web), 3478 UDP (STUN);
# - keeps the system journal small and for 7 days at most;
# - lets `deploy` run, without a password, only the few admin commands deploy.sh needs.

users:
  - name: quidam
    system: true
    shell: /usr/sbin/nologin
    homedir: /nonexistent
    no_create_home: true
    lock_passwd: true
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    # In the quidam group so the releases it uploads can be given that group (the service reads them as quidam).
    groups: [quidam]
    ssh_authorized_keys:
      # PASTE YOUR PUBLIC KEY ON THE NEXT LINE, in place of everything after the dash and space.
      - ssh-ed25519 AAAA... REPLACE_WITH_YOUR_PUBLIC_KEY

disable_root: true
ssh_pwauth: false
timezone: Etc/UTC

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - rsync
  - ufw
  - unattended-upgrades

write_files:
  # SSH: keys only, no root.
  - path: /etc/ssh/sshd_config.d/10-quidam.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers deploy

  # Automatic security updates, every day.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  # Reboot by itself at 04:30 UTC when an update needs it (a few seconds of downtime, at night in Europe).
  - path: /etc/apt/apt.conf.d/52quidam-upgrades
    permissions: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

  # Keep the system journal small and short-lived (it never holds visitor addresses, but keep it lean).
  - path: /etc/systemd/journald.conf.d/10-quidam.conf
    permissions: '0644'
    content: |
      [Journal]
      SystemMaxUse=200M
      MaxRetentionSec=7day

  # The only admin commands `deploy` may run without a password (all used by deploy/deploy.sh).
  # Note: `deploy` is your own account and can install a service file, so treat its SSH key like
  # a root password. The list is here to avoid mistakes, not to contain a stolen key.
  - path: /etc/sudoers.d/10-quidam-deploy
    permissions: '0440'
    content: |
      Cmnd_Alias LEAKCHECK_DEPLOY = \
        /usr/bin/systemctl restart quidam, \
        /usr/bin/systemctl status quidam, \
        /usr/bin/systemctl status caddy, \
        /usr/bin/systemctl reload caddy, \
        /usr/bin/systemctl daemon-reload, \
        /usr/bin/systemctl enable quidam, \
        /usr/bin/journalctl -u quidam *, \
        /usr/bin/journalctl -u caddy *, \
        /usr/bin/install -o root -g root -m 0644 /home/deploy/staging/Caddyfile /etc/caddy/Caddyfile, \
        /usr/bin/install -o root -g quidam -m 0640 /home/deploy/staging/quidam.env /etc/quidam/quidam.env, \
        /usr/bin/install -o root -g root -m 0644 /home/deploy/staging/quidam.service /etc/systemd/system/quidam.service
      deploy ALL=(root) NOPASSWD: LEAKCHECK_DEPLOY

runcmd:
  # Node.js 24 from NodeSource's official package repository (gets security updates through apt).
  - install -d -m 0755 /etc/apt/keyrings
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
  # Caddy from its official package repository.
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs caddy
  # Folders: releases belong to deploy and are readable by the quidam group (setgid: new files inherit the group).
  - install -d -o deploy -g quidam -m 2750 /opt/quidam /opt/quidam/releases
  - install -d -o root -g quidam -m 0750 /etc/quidam
  - install -d -o quidam -g quidam -m 0750 /var/lib/quidam
  - install -d -o deploy -g deploy -m 0700 /home/deploy/staging
  # Firewall: deny everything coming in, except SSH, web (HTTP/1, HTTP/2 and HTTP/3) and STUN.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw allow 3478/udp
  - ufw --force enable
  - systemctl restart systemd-journald
  - systemctl restart ssh
  - systemctl enable --now unattended-upgrades
  - systemctl enable --now caddy

final_message: "quidam server ready after $UPTIME seconds. Next: run deploy/deploy.sh --first-run from your computer."
